name: efaktura-sk

on:
  push:
    paths: ["efaktura-sk/**", ".github/workflows/efaktura-sk.yml"]
  pull_request:
    paths: ["efaktura-sk/**", ".github/workflows/efaktura-sk.yml"]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: efaktura-sk/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,schematron]"
      - run: ruff check app tests scripts
      - name: Fetch official EN 16931 + Peppol Schematron
        run: scripts/fetch_validation_artifacts.sh validation-artifacts
      - name: Tests (incl. official Schematron conformance)
        run: pytest -q -rs
        env:
          SCHEMATRON_DIR: validation-artifacts

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: efaktura-sk/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: efaktura-sk/frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
