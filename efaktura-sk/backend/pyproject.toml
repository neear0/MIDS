[project]
name = "efaktura-sk"
version = "0.1.0"
description = "AI-powered Slovak e-invoice & tax compliance platform (EN 16931 / UBL 2.1 / Peppol BIS 3.0)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "email-validator>=2.2",
    "python-multipart>=0.0.9",
    "lxml>=5.3",
    "reportlab>=4.2",
    "pypdf>=5.0",
    "httpx>=0.27",
    "pyjwt>=2.9",
    "cryptography>=43",
    "anthropic>=1.8",
]

[project.optional-dependencies]
schematron = ["saxonche>=12.5"]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["ai/knowledge/*.md"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.File", "fastapi.Query", "fastapi.Depends"]

[tool.pytest.ini_options]
testpaths = ["tests"]
